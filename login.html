
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SmartPark</title>
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <div class="login-page">

        <div class="login-card">

            <div class="login-logo">
                <h1>Smart<span>Park</span></h1>
                <p>Park smart Live Better.</p>
            </div>

            <div class="login-heading">
                <h2>Welcome Back</h2>
                <p>Login to manage your parking easily.</p>
            </div>

            <form>

                <div class="login-field">
                    <label for="loginEmail">Email Address</label>
                    <input
                        type="email"
                        id="loginEmail"
                        placeholder="Enter your email"
                    >
                </div>

                <div class="login-field">
                    <label for="loginPassword">Password</label>
                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter your password"
                    >
                </div>

                <div class="login-options">

                    <label>
                        <input type="checkbox" id="rememberMe">
                        Remember me
                    </label>

                    <a href="#">Forgot Password?</a>

                </div>

                <button type="button" id="loginButton">
                    Login
                </button>

            </form>

            <p class="signup-link">
                Don't have an account?
                <a href="signup.html">Create Account</a>
            </p>

            <a class="back-home" href="index.html">
                ← Back to SmartPark
            </a>

        </div>

    </div>


    <script>
        let loginButton = document.getElementById("loginButton");

        loginButton.addEventListener("click", function() {

            let email = document.getElementById("loginEmail").value.trim();
            let password = document.getElementById("loginPassword").value;

            if(email === "") {
                alert("Please enter your email");
                return;
            }

            if(password === "") {
                alert("Please enter your password");
                return;
            }

            let savedUser = localStorage.getItem("smartParkUser");

            if(savedUser === null) {
                alert("No account found. Please create an account first.");
                return;
            }

            let user = JSON.parse(savedUser);

            if(email === user.email && password === user.password) {

                localStorage.setItem("smartParkLoggedIn", "true");

                alert("Login successful!");

                window.location.href = "index.html";

            } else {

                alert("Invalid email or password");

            }

        });
    </script>

</body>
</html>
